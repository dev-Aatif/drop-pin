<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Drop-Pin</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container glass-card">
        <div class="text-center" style="margin-bottom: 24px;">
            <i class="fa-brands fa-pinterest" style="color: var(--accent); font-size: 3rem; margin-bottom: 16px;"></i>
            <h2>Drop-Pin</h2>
            <p style="color: var(--text-muted); margin-top: 8px;">Admin Access</p>
        </div>
        
        {% if error %}
        <div class="toast error" style="position: static; margin-bottom: 20px; transform: none; animation: none; width: 100%;">
            <i class="fa-solid fa-circle-exclamation"></i> <span>{{ error }}</span>
        </div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </form>
    </div>
</body>
</html>
